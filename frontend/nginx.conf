server {
  listen 80;
  server_name _;
  # Keep a small multipart allowance above the backend's default 200 MiB file cap.
  # Operators who change MAX_UPLOAD_MB should review this independent ingress cap.
  client_max_body_size ${NGINX_UPLOAD_LIMIT};
  client_body_timeout 10m;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Resumable source ingestion uses bounded chunk requests. The backend applies
  # the stricter UPLOAD_CHUNK_MB limit and validates Content-Range/offset/hash;
  # nginx never receives the complete long-form source in one request.
  location /api/upload-sessions/ {
    # 32 MiB default chunk plus bounded protocol overhead. Operators who
    # change UPLOAD_CHUNK_MB must update this independent ingress ceiling.
    client_max_body_size 34m;
    proxy_pass http://backend:8000/api/upload-sessions/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
