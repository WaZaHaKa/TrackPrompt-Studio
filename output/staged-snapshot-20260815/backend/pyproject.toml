[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trackprompt-studio-backend"
version = "0.3.0"
description = "Local-only music analysis and deterministic prompt API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.10,<3",
  "pyloudnorm>=0.1.1,<1",
  "python-multipart>=0.0.18,<1",
  "scipy>=1.12,<2",
  "soundfile>=0.12.1,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
enhanced = [
  "librosa>=0.10.2,<1",
  "scikit-learn>=1.5,<2",
]
deep = [
  "demucs>=4.0.1,<5",
]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --basetemp=.pytest_run -p no:cacheprovider"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".venv", ".pytest*", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["tests"]
